{% extends "accounts/base.html" %}

{% block title %}Reset Password{% endblock %}

{% block content %}
<h1>Reset Password</h1>
<p>Enter your email address to receive a password reset link.</p>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="submit" value="Reset My Password">
</form>
{% endblock %}
